services:
  # Production: static export served by nginx on http://localhost:8080
  site:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: vinay-portfolio:latest
    ports:
      - "8080:80"
    restart: unless-stopped

  # Development: `next dev` with hot reload on http://localhost:3000
  # Started only with `--profile dev`.
  dev:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    image: vinay-portfolio-dev:latest
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      # Keep the container's own node_modules and build cache out of the host tree.
      - node_modules:/app/node_modules
      - next_cache:/app/.next

volumes:
  node_modules:
  next_cache:
